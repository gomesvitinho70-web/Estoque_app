<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estoque — Livro de Controle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="ledger">

    <header class="ledger__header">
      <div class="ledger__title">
        <h1>Estoque</h1>
        <p class="ledger__subtitle">livro de controle de produtos</p>
      </div>
      <div class="ledger__totals">
        <div class="stat">
          <span class="stat__value" id="statCount">0</span>
          <span class="stat__label">itens cadastrados</span>
        </div>
        <div class="stat">
          <span class="stat__value" id="statUnits">0</span>
          <span class="stat__label">unidades em estoque</span>
        </div>
        <div class="stat stat--accent">
          <span class="stat__value" id="statValue">R$ 0,00</span>
          <span class="stat__label">valor total</span>
        </div>
      </div>
    </header>

    <section class="card" id="formCard">
      <h2 class="card__title" id="formTitle">Novo produto</h2>
      <form id="productForm" class="form">
        <input type="hidden" id="productId" />

        <div class="field">
          <label for="name">Nome do produto</label>
          <input type="text" id="name" required placeholder="Ex: Caneta esferográfica azul" />
        </div>

        <div class="field field--small">
          <label for="code">Código (SKU)</label>
          <input type="text" id="code" required placeholder="Ex: CAN-001" />
        </div>

        <div class="field field--small">
          <label for="quantity">Quantidade</label>
          <input type="number" id="quantity" min="0" required placeholder="0" />
        </div>

        <div class="field field--small">
          <label for="minQuantity">Estoque mínimo</label>
          <input type="number" id="minQuantity" min="0" placeholder="0" />
        </div>

        <div class="field field--small">
          <label for="price">Preço unitário (R$)</label>
          <input type="number" id="price" min="0" step="0.01" placeholder="0,00" />
        </div>

        <div class="form__actions">
          <button type="submit" class="btn btn--primary" id="submitBtn">Cadastrar produto</button>
          <button type="button" class="btn btn--ghost" id="cancelEditBtn" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="card card--table">
      <div class="card__toolbar">
        <h2 class="card__title">Produtos</h2>
        <input type="search" id="searchInput" placeholder="Buscar por nome ou código…" class="search" />
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>Quantidade</th>
            <th>Mínimo</th>
            <th>Preço</th>
            <th>Subtotal</th>
            <th>Status</th>
            <th class="table__actions-col">Ações</th>
          </tr>
        </thead>
        <tbody id="productsBody">
        </tbody>
      </table>

      <p class="empty-state" id="emptyState" hidden>
        Nenhum produto cadastrado ainda. Use o formulário acima para adicionar o primeiro item.
      </p>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
